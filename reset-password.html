<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperar senha — Bomba Petch</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b10;color:#fff;font-family:Arial,sans-serif;padding:20px;box-sizing:border-box}.card{width:min(440px,100%);background:#121720;border:1px solid #29313d;border-radius:16px;padding:28px;box-sizing:border-box;box-shadow:0 20px 60px #0008}.orange{color:#ff7300}.field{display:grid;gap:7px;margin:14px 0}.field input{width:100%;box-sizing:border-box;padding:13px;background:#080b10;color:#fff;border:1px solid #343b47;border-radius:8px;font-size:16px}.btn{width:100%;border:1px solid #ff7300;background:#ff7300;color:#08090b;padding:13px 15px;border-radius:9px;cursor:pointer;font-weight:bold;font-size:15px}.muted{color:#9aa3b0}.error{color:#ff8188;margin-top:12px}.ok{color:#64e39c;margin-top:12px}.hidden{display:none}a{color:#ff7300}
</style>
</head>
<body>
<div class="card">
<h1>🔐 <span class="orange">Nova senha</span></h1>
<p class="muted">Digite sua nova senha para recuperar o acesso ao BOMBA PETCH.</p>
<div id="loading">Validando o link de recuperação...</div>
<form id="form" class="hidden">
<div class="field"><label>Nova senha</label><input id="password" type="password" minlength="6" autocomplete="new-password" required></div>
<div class="field"><label>Confirmar nova senha</label><input id="confirm" type="password" minlength="6" autocomplete="new-password" required></div>
<button class="btn" type="submit">ALTERAR SENHA</button>
</form>
<div id="message"></div>
<p><a href="./">← Voltar para o site</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB='https://vgurvbdbpxcgkhmunlxr.supabase.co';
const KEY='sb_publishable_Dlgj0c5D_PVKP0h7x6GZ4w_BssxbIoj';
const supabase=window.supabase.createClient(SB,KEY);
const loading=document.getElementById('loading');
const form=document.getElementById('form');
const message=document.getElementById('message');
function showError(t){loading.classList.add('hidden');message.className='error';message.textContent=t}
function showForm(){loading.classList.add('hidden');form.classList.remove('hidden')}
supabase.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY') showForm()});
(async()=>{
 const {data:{session}}=await supabase.auth.getSession();
 if(session) showForm();
 else if(!location.hash.includes('access_token')) showError('Link inválido ou expirado. Solicite uma nova recuperação de senha no site.');
 setTimeout(async()=>{const {data:{session:s}}=await supabase.auth.getSession();if(s)showForm()},1200);
})();
form.onsubmit=async(e)=>{
 e.preventDefault();
 const password=document.getElementById('password').value;
 const confirm=document.getElementById('confirm').value;
 message.textContent='';
 if(password.length<6){message.className='error';message.textContent='A senha precisa ter pelo menos 6 caracteres.';return}
 if(password!==confirm){message.className='error';message.textContent='As senhas não são iguais.';return}
 const {error}=await supabase.auth.updateUser({password});
 if(error){message.className='error';message.textContent=error.message;return}
 form.classList.add('hidden');message.className='ok';message.innerHTML='Senha alterada com sucesso! <a href="./">Clique aqui para entrar.</a>';
};
</script>
</body>
</html>
