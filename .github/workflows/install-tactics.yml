name: Install Tactics
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[tactics-installed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Tactics assets to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'tactics.js' in s:
              raise SystemExit(0)
          s=s.replace('</head>','<link rel="stylesheet" href="tactics.css"></head>',1)
          s=s.replace('</body>','<script src="tactics.js"></script></body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '[tactics-installed] Instala Taticas nos perfis' || exit 0
          git push
