# Deploy estático do BOMBA PETCH no GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Aplicar visual premium e navegação mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="mobile-premium.css?v=3">'
          if css not in s:
              s=s.replace('</head>',css+'</head>',1)
          mobile='''<nav class="bottom-nav" aria-label="Navegação mobile"><button onclick="go('home')"><span class="ico">⌂</span>Início</button><button onclick="go('profiles')"><span class="ico">👤</span>Perfis</button><button onclick="go('games')"><span class="ico">🎮</span>Jogos</button><button onclick="go('ranking')"><span class="ico">📊</span>Ranking</button><button onclick="go('trophies')"><span class="ico">🏆</span>Troféus</button></nav>'''
          if 'class="bottom-nav"' not in s:
              s=s.replace('</body>',mobile+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
