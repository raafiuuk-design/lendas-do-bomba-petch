# Deploy estático do BOMBA PETCH no GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Aplicar visual premium
        run: python3 -c "p='index.html';s=open(p,encoding='utf-8').read();tag='<link rel=\"stylesheet\" href=\"mobile-premium.css?v=2\">';s=s.replace('</head>',tag+'</head>',1) if tag not in s else s;open(p,'w',encoding='utf-8').write(s)"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
