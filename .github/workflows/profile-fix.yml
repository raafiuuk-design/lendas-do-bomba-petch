name: Profile login fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'profile-fix.js'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'profile-fix.js' not in s:
              s=s.replace('</body>','<script src="profile-fix.js"></script></body>')
              p.write_text(s,encoding='utf-8')
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Ativa botão de login dos perfis' || exit 0
          git push
