name: Corrigir Ranking editável
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-ranking.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'index.html';
            let html = fs.readFileSync(path, 'utf8');
            const section = `<section id="ranking" class="page"><h1>📊 Ranking</h1><p class="muted">Ranking oficial dos jogadores. Todos podem visualizar. Para editar, clique no botão e digite a senha.</p><div class="standings" style="margin-top:24px"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px;border-bottom:1px solid #29313d"><h2 style="margin:0">🏆 Ranking</h2><button class="btn primary" id="rankingEditBtn">🔒 Editar ranking</button></div><div class="table-wrap"><table class="editable-table" id="rankingTable"><thead><tr><th>#</th><th>Jogador</th><th>Vitórias</th><th>Empates</th><th>Derrotas</th><th>Pontos</th></tr></thead><tbody id="rankingBody"></tbody></table></div><div id="rankingSaveRow" style="display:none;gap:10px;align-items:center;flex-wrap:wrap;padding:18px"><button class="btn primary" id="rankingSaveBtn">💾 Salvar alterações</button><button class="btn" id="rankingCancelBtn">Cancelar</button><span id="rankingMsg" class="save-message"></span></div></div></section><section id="table"`;
            const re = /<section id="ranking" class="page">[\s\S]*?<section id="table"/;
            if (!re.test(html)) throw new Error('Ranking section not found');
            html = html.replace(re, section);
            const modal = `<div id="rankingPasswordModal" class="table-password-modal"><div class="table-password-box"><h2>🔒 Senha do Ranking</h2><p class="muted">Digite a senha para liberar a edição.</p><input id="rankingPasswordInput" type="password" inputmode="numeric" placeholder="Digite a senha" autocomplete="off"><div id="rankingPasswordMsg" class="table-message"></div><div class="modal-actions"><button class="btn primary" id="rankingPasswordSubmit">Entrar</button><button class="btn" id="rankingPasswordCancel">Cancelar</button></div></div></div>`;
            html = html.replace(/<div id="rankingPasswordModal"[\s\S]*?<\/div><\/div>/, modal);
            if (!html.includes('id="rankingPasswordModal"')) html = html.replace('</body>', modal + '</body>');
            const js = `<script id="editable-ranking-script">(()=>{const SB='https://vgurvbdbpxcgkhmunlxr.supabase.co',KEY='sb_publishable_Dlgj0c5D_PVKP0h7x6GZ4w_BssxbIoj',RPC=SB+'/rest/v1/rpc/';let rows=[],editing=false;const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};async function call(fn,body){const r=await fetch(RPC+fn,{method:'POST',headers:H,body:JSON.stringify(body||{})});if(!r.ok)throw Error(await r.text());return r.json()}function render(){const b=document.getElementById('rankingBody');if(!b)return;rows.sort((a,b)=>(b.wins*3+b.draws-b.losses)-(a.wins*3+a.draws-b.losses)||a.player.localeCompare(b.player));b.innerHTML=rows.map((r,i)=>{const pts=r.wins*3+r.draws-r.losses;return editing?'<tr><td>'+(i+1)+'</td><td>'+r.player+'</td><td><input type="number" min="0" class="ranking-edit" data-i="'+i+'" data-k="wins" value="'+r.wins+'"></td><td><input type="number" min="0" class="ranking-edit" data-i="'+i+'" data-k="draws" value="'+r.draws+'"></td><td><input type="number" min="0" class="ranking-edit" data-i="'+i+'" data-k="losses" value="'+r.losses+'"></td><td class="points">'+pts+'</td></tr>':'<tr><td>'+(i+1)+'</td><td>'+r.player+'</td><td>'+r.wins+'</td><td>'+r.draws+'</td><td>'+r.losses+'</td><td class="points">'+pts+'</td></tr>'}).join('');document.getElementById('rankingSaveRow').style.display=editing?'flex':'none';if(editing)b.querySelectorAll('input').forEach(x=>x.oninput=()=>{rows[+x.dataset.i][x.dataset.k]=Math.max(0,parseInt(x.value||0,10)||0);render()})}async function load(){try{rows=await call('bomba_petch_ranking_get',{})||[]}catch(e){rows=[{player:'Rafagamer',wins:0,draws:0,losses:0},{player:'Cristian',wins:0,draws:0,losses:0},{player:'Leandro',wins:0,draws:0,losses:0},{player:'Berna',wins:0,draws:0,losses:0}]}render()}function openPass(){const m=document.getElementById('rankingPasswordModal'),i=document.getElementById('rankingPasswordInput'),msg=document.getElementById('rankingPasswordMsg');i.value='';msg.textContent='';m.classList.add('show');setTimeout(()=>i.focus(),100)}document.getElementById('rankingEditBtn').onclick=openPass;document.getElementById('rankingPasswordCancel').onclick=()=>document.getElementById('rankingPasswordModal').classList.remove('show');document.getElementById('rankingPasswordSubmit').onclick=()=>{const i=document.getElementById('rankingPasswordInput'),msg=document.getElementById('rankingPasswordMsg');if(String(i.value).trim()!=='24'+'10'){msg.textContent='Senha incorreta.';return}document.getElementById('rankingPasswordModal').classList.remove('show');editing=true;document.getElementById('rankingMsg').textContent='Edição liberada.';render()};document.getElementById('rankingPasswordInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('rankingPasswordSubmit').click()});document.getElementById('rankingCancelBtn').onclick=()=>{editing=false;document.getElementById('rankingMsg').textContent='';load()};document.getElementById('rankingSaveBtn').onclick=async()=>{try{const ok=await call('bomba_petch_ranking_save',{p_password:'24'+'10',p_rows:rows});if(!ok){document.getElementById('rankingMsg').textContent='Senha inválida.';return}editing=false;document.getElementById('rankingMsg').textContent='Ranking salvo com sucesso!';load()}catch(e){document.getElementById('rankingMsg').textContent='Erro ao salvar o ranking.'}};load()})();</script>`;
            html = html.replace(/<script id="editable-ranking-script">[\s\S]*?<\/script>/, js);
            if (!html.includes('id="editable-ranking-script"')) html = html.replace('</body>', js + '</body>');
            fs.writeFileSync(path, html);
            const {owner,repo}=context.repo;
            const current=await github.rest.repos.getContent({owner,repo,path:'index.html'});
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'index.html',message:'Corrige desbloqueio do Ranking',content:Buffer.from(html).toString('base64'),sha:current.data.sha});