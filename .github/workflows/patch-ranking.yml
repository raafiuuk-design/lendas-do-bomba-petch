name: Patch editable Ranking
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-ranking.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'index.html';
            let html = fs.readFileSync(path, 'utf8');
            if (html.includes('id="editable-ranking-script"')) { console.log('Ranking patch already applied'); process.exit(0); }
            const section = `<section id="ranking" class="page"><h1>📊 Ranking</h1><p class="muted">Ranking oficial dos jogadores. Todos podem visualizar; a edição é protegida por senha.</p><div class="standings" style="margin-top:24px"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px;border-bottom:1px solid #29313d"><h2 style="margin:0">🏆 Ranking</h2><button class="btn primary" id="rankingEditBtn">🔒 Editar ranking</button></div><div class="table-wrap"><table class="editable-table" id="rankingTable"><thead><tr><th>#</th><th>Jogador</th><th>Vitórias</th><th>Empates</th><th>Derrotas</th><th>Pontos</th></tr></thead><tbody id="rankingBody"></tbody></table></div><div id="rankingSaveRow" style="display:none;gap:10px;align-items:center;flex-wrap:wrap;padding:18px"><button class="btn primary" id="rankingSaveBtn">💾 Salvar alterações</button><button class="btn" id="rankingCancelBtn">Cancelar</button><span id="rankingMsg" class="save-message"></span></div></div></section><section id="table"`;
            const re = /<section id="ranking" class="page">[\s\S]*?<section id="table"/;
            if (!re.test(html)) throw new Error('Ranking section not found');
            html = html.replace(re, section);
            const js = `<script id="editable-ranking-script">(()=>{let rankRows=[],rankEditing=false;const rankPass='2410';const rankModal=document.getElementById('tablePasswordModal');const rankInput=document.getElementById('tablePasswordInput');const rankInput2=document.getElementById('tablePasswordInput2');const rankTitle=document.getElementById('tablePasswordTitle');const rankText=document.getElementById('tablePasswordText');const rankMsg=document.getElementById('tablePasswordMessage');const rankSubmit=document.getElementById('tablePasswordSubmit');const rankCancel=document.getElementById('tablePasswordCancel');function rankRender(){const b=document.getElementById('rankingBody');if(!b)return;rankRows.sort((a,b)=>(b.wins*3+b.draws-b.losses)-(a.wins*3+a.draws-b.losses)||a.player.localeCompare(b.player));b.innerHTML=rankRows.map((r,i)=>{const pts=r.wins*3+r.draws-r.losses;return rankEditing?'<tr><td>'+(i+1)+'</td><td>'+r.player+'</td><td><input class="ranking-edit" data-i="'+i+'" data-k="wins" type="number" min="0" value="'+r.wins+'"></td><td><input class="ranking-edit" data-i="'+i+'" data-k="draws" type="number" min="0" value="'+r.draws+'"></td><td><input class="ranking-edit" data-i="'+i+'" data-k="losses" type="number" min="0" value="'+r.losses+'"></td><td class="points">'+pts+'</td></tr>':'<tr><td>'+(i+1)+'</td><td>'+r.player+'</td><td>'+r.wins+'</td><td>'+r.draws+'</td><td>'+r.losses+'</td><td class="points">'+pts+'</td></tr>'}).join('');document.getElementById('rankingSaveRow').style.display=rankEditing?'flex':'none';if(rankEditing)b.querySelectorAll('input').forEach(x=>x.oninput=()=>{rankRows[+x.dataset.i][x.dataset.k]=Math.max(0,parseInt(x.value||0,10)||0);rankRender()})}async function rankLoad(){try{rankRows=await rpc('bomba_petch_ranking_get',{})||[]}catch(e){rankRows=[{player:'Rafagamer',wins:0,draws:0,losses:0},{player:'Cristian',wins:0,draws:0,losses:0},{player:'Leandro',wins:0,draws:0,losses:0},{player:'Berna',wins:0,draws:0,losses:0}]}rankRender()}document.getElementById('rankingEditBtn').onclick=()=>{rankTitle.textContent='🔒 Senha do Ranking';rankText.textContent='Digite a senha para liberar a edição.';rankInput.value='';rankInput2.style.display='none';rankMsg.textContent='';rankModal.classList.add('show');rankInput.focus()};rankCancel.onclick=()=>rankModal.classList.remove('show');rankSubmit.onclick=()=>{if(rankInput.value!==rankPass){rankMsg.textContent='Senha incorreta.';return}rankModal.classList.remove('show');rankEditing=true;document.getElementById('rankingMsg').textContent='Edição liberada.';rankRender()};document.getElementById('rankingCancelBtn').onclick=()=>{rankEditing=false;rankLoad()};document.getElementById('rankingSaveBtn').onclick=async()=>{try{const ok=await rpc('bomba_petch_ranking_save',{p_password:rankPass,p_rows:rankRows});if(!ok)throw Error();rankEditing=false;document.getElementById('rankingMsg').textContent='Ranking salvo com sucesso!';rankLoad()}catch(e){document.getElementById('rankingMsg').textContent='Erro ao salvar o ranking.'}};document.querySelector('[data-page="ranking"]').addEventListener('click',rankLoad);rankLoad()})();</script>`;
            html = html.replace('</script></body>', '</script>'+js+'</body>');
            const {owner,repo} = context.repo;
            const current = await github.rest.repos.getContent({owner,repo,path:'index.html'});
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'index.html',message:'Adiciona tabela editável na aba Ranking',content:Buffer.from(html).toString('base64'),sha:current.data.sha});
