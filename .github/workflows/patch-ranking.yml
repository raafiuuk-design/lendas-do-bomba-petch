name: Remove abas Ranking e Tabela
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-ranking.yml'
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'index.html';
            let html = fs.readFileSync(path, 'utf8');
            html = html.replace(/<button[^>]*data-page="ranking"[^>]*>.*?<\/button>/g, '');
            html = html.replace(/<button[^>]*data-page="table"[^>]*>.*?<\/button>/g, '');
            html = html.replace(/<section id="ranking" class="page">[\s\S]*?<section id="table" class="page">/, '<section id="table" class="page">');
            html = html.replace(/<section id="table" class="page">[\s\S]*?<section id="trophies" class="page">/, '<section id="trophies" class="page">');
            html = html.replace(/<div id="rankingPasswordModal"[\s\S]*?<\/div><\/div>/g, '');
            html = html.replace(/<script id="editable-ranking-script">[\s\S]*?<\/script>/g, '');
            html = html.replace(/<style id="protected-table-style">[\s\S]*?<\/style>/g, '');
            fs.writeFileSync(path, html);
            const {owner,repo}=context.repo;
            const current=await github.rest.repos.getContent({owner,repo,path:'index.html'});
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path:'index.html',message:'Remove abas Ranking e Tabela',content:Buffer.from(html).toString('base64'),sha:current.data.sha});