name: Enable table password setup
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/setup-table-password.yml'
permissions:
  contents: write
jobs:
  patch-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Tabela password flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_modal=re.compile(r'<div id="tablePasswordModal".*?</div></div>', re.S)
          modal='''<div id="tablePasswordModal" class="table-password-modal"><div class="table-password-box"><h2 id="tablePasswordTitle">🔐 Senha da Tabela</h2><p id="tablePasswordText" class="muted">Digite a senha para liberar a edição.</p><input id="tablePasswordInput" type="password" placeholder="Senha" autocomplete="new-password"><input id="tablePasswordInput2" type="password" placeholder="Confirme a senha" autocomplete="new-password" style="display:none"><div id="tablePasswordMessage" class="table-message"></div><div class="modal-actions"><button class="btn primary" id="tablePasswordSubmit">Continuar</button><button class="btn" id="tablePasswordCancel">Cancelar</button></div></div></div>'''
          s,n=old_modal.subn(modal,s,count=1)
          js=r'''const TABLE_API=SB+'/rest/v1/bomba_petch_tabela';
let tableRows=[],tableEditing=false,tablePassword='',tableSetup=false;
function tableHeaders(json=false){return json?{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'}:{apikey:KEY,Authorization:'Bearer '+KEY};}
async function tableRpc(fn,body){const r=await fetch(RPC+fn,{method:'POST',headers:tableHeaders(true),body:JSON.stringify(body||{})});if(!r.ok)throw Error(await r.text());return r.json();}
async function tablePasswordExists(){try{return !!(await tableRpc('bomba_petch_tabela_password_exists',{}));}catch(e){return false;}}
async function loadProtectedTable(){const body=document.getElementById('tableStandingsBody');if(!body)return;try{const r=await fetch(TABLE_API+'?select=id,player_name,wins,draws,losses,points&order=points.desc,wins.desc,id.asc',{headers:tableHeaders()});if(!r.ok)throw Error(await r.text());tableRows=await r.json();renderProtectedTable();}catch(e){body.innerHTML='<tr><td colspan="6">Não foi possível carregar a tabela.</td></tr>';console.error(e)}}
function renderProtectedTable(){const body=document.getElementById('tableStandingsBody');if(!body)return;body.innerHTML=tableRows.map((r,i)=>tableEditing?'<tr><td>'+(i+1)+'</td><td><input class="name" data-id="'+r.id+'" data-field="player_name" value="'+esc(r.player_name)+'"></td><td><input type="number" min="0" data-id="'+r.id+'" data-field="wins" value="'+Number(r.wins||0)+'"></td><td><input type="number" min="0" data-id="'+r.id+'" data-field="draws" value="'+Number(r.draws||0)+'"></td><td><input type="number" min="0" data-id="'+r.id+'" data-field="losses" value="'+Number(r.losses||0)+'"></td><td><input type="number" data-id="'+r.id+'" data-field="points" value="'+Number(r.points||0)+'"></td></tr>':'<tr><td>'+(i+1)+'</td><td>'+esc(r.player_name)+'</td><td>'+Number(r.wins||0)+'</td><td>'+Number(r.draws||0)+'</td><td>'+Number(r.losses||0)+'</td><td class="points">'+Number(r.points||0)+'</td></tr>').join('');}
async function openTablePassword(){tableSetup=!(await tablePasswordExists());document.getElementById('tablePasswordInput').value='';document.getElementById('tablePasswordInput2').value='';document.getElementById('tablePasswordMessage').textContent='';document.getElementById('tablePasswordTitle').textContent=tableSetup?'🔐 Criar senha da Tabela':'🔒 Entrar para editar';document.getElementById('tablePasswordText').textContent=tableSetup?'Primeiro acesso: escolha a senha que somente você terá. Use pelo menos 6 caracteres.':'Digite a senha da Tabela para liberar a edição.';document.getElementById('tablePasswordInput2').style.display=tableSetup?'block':'none';document.getElementById('tablePasswordInput').placeholder=tableSetup?'Nova senha':'Senha';document.getElementById('tablePasswordModal').classList.add('show');setTimeout(()=>document.getElementById('tablePasswordInput').focus(),50)}
async function verifyTablePassword(){const pass=document.getElementById('tablePasswordInput').value,pass2=document.getElementById('tablePasswordInput2').value,msg=document.getElementById('tablePasswordMessage');msg.textContent='';if(pass.length<6){msg.textContent='A senha precisa ter pelo menos 6 caracteres.';return}if(tableSetup&&pass!==pass2){msg.textContent='As senhas não conferem.';return}try{let ok;if(tableSetup){ok=await tableRpc('bomba_petch_set_tabela_password',{p_password:pass});if(!ok){msg.textContent='Não foi possível criar a senha.';return}}else{ok=await tableRpc('bomba_petch_verify_tabela_password',{p_password:pass});if(!ok){msg.textContent='Senha incorreta.';return}}tablePassword=pass;tableEditing=true;document.getElementById('tablePasswordModal').classList.remove('show');document.getElementById('protectedTable').classList.add('table-editing');document.getElementById('tableEditBtn').textContent='🔓 Editando';document.getElementById('tableEditBtn').disabled=true;renderProtectedTable();}catch(e){msg.textContent='Erro de conexão.';console.error(e)}}
async function saveProtectedTable(){const msg=document.getElementById('tableSaveMessage');msg.textContent='Salvando...';const rows=tableRows.map(r=>{const out={id:r.id};document.querySelectorAll('[data-id="'+r.id+'"]').forEach(el=>{out[el.dataset.field]=el.dataset.field==='player_name'?el.value.trim():Number(el.value||0)});return out});try{const ok=await tableRpc('bomba_petch_update_tabela',{p_password:tablePassword,p_rows:rows});if(!ok){msg.textContent='Senha inválida.';return}msg.textContent='Tabela salva!';tableEditing=false;tablePassword='';document.getElementById('protectedTable').classList.remove('table-editing');document.getElementById('tableEditBtn').textContent='🔒 Editar tabela';document.getElementById('tableEditBtn').disabled=false;await loadProtectedTable();}catch(e){msg.textContent='Erro ao salvar.';console.error(e)}}
function cancelProtectedTable(){tableEditing=false;tablePassword='';document.getElementById('protectedTable').classList.remove('table-editing');document.getElementById('tableEditBtn').textContent='🔒 Editar tabela';document.getElementById('tableEditBtn').disabled=false;document.getElementById('tableSaveMessage').textContent='';renderProtectedTable();}
document.addEventListener('DOMContentLoaded',()=>{loadProtectedTable();document.getElementById('tableEditBtn')?.addEventListener('click',openTablePassword);document.getElementById('tablePasswordSubmit')?.addEventListener('click',verifyTablePassword);document.getElementById('tablePasswordCancel')?.addEventListener('click',()=>document.getElementById('tablePasswordModal').classList.remove('show'));document.getElementById('tableSaveBtn')?.addEventListener('click',saveProtectedTable);document.getElementById('tableCancelBtn')?.addEventListener('click',cancelProtectedTable);document.getElementById('tablePasswordInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')verifyTablePassword()});});
</script>'''
          s2,n2=re.subn(r'const TABLE_API=.*?</script>',js,s,count=1,flags=re.S)
          if n2!=1: raise SystemExit('Nao encontrei o bloco da Tabela para atualizar')
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Allow admin to choose Tabela password'
          git push
