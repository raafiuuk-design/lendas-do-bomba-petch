name: Site repair
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-profile-login.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair profile password confirmation and restore Table
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # The profile password button must explicitly call the confirmation function.
          old='<button class="btn primary" id="passwordSubmit">Continuar</button>'
          new='<button type="button" class="btn primary" id="passwordSubmit" onclick="submitPassword()">Continuar</button>'
          s=s.replace(old,new,1)

          # Also allow Enter in either password field.
          marker='<script>'
          enter_code='<script>document.addEventListener("keydown",function(e){if(e.key==="Enter"&&(e.target&&((e.target.id==="password1")||(e.target.id==="password2")))){e.preventDefault();submitPassword();}});</script>'
          if 'e.target.id==="password1"' not in s:
              s=s.replace(marker,enter_code+marker,1)

          # Accept all valid Supabase RPC result shapes.
          s=s.replace("if(!result.ok){err.textContent='Senha incorreta.';return}", "if(!(result===true || result?.ok===true || result?.valid===true)){err.textContent='Senha incorreta.';return}")

          # Restore Tabela if it is missing, but never restore RANK.
          if 'data-page="table"' not in s:
              s=s.replace('<button data-page="games">🎮 Partidas</button>', '<button data-page="table">📋 Tabela</button><button data-page="games">🎮 Partidas</button>',1)
          if 'id="protectedTable"' not in s:
              table_html='''<section id="table" class="page"><h1>📋 Tabela</h1><p class="muted">Tabela visível para todos. Somente quem tiver a senha pode editar.</p><div id="protectedTable" class="standings"><h2>📊 Classificação</h2><div class="table-wrap"><table><thead><tr><th>#</th><th>Jogador</th><th>Vitórias</th><th>Empates</th><th>Derrotas</th><th>Pontos</th></tr></thead><tbody id="tableStandingsBody"></tbody></table></div></div><div class="actions"><button class="btn primary" id="tableEditBtn">🔒 Editar tabela</button><button class="btn primary" id="tableSaveBtn">💾 Salvar</button><button class="btn" id="tableCancelBtn">Cancelar</button><span id="tableSaveMessage" class="save-message"></span></div></section>'''
              s=s.replace('<section id="seasons" class="page">',table_html+'<section id="seasons" class="page">',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Corrige botao de confirmacao da senha dos perfis' || exit 0
          git push
