name: Site patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-profile-login.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tactics assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'tactics.js' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="tactics.css"></head>',1)
              s=s.replace('</body>','<script src="tactics.js"></script></body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '[tactics-installed] Adiciona Taticas aos perfis' || exit 0
          git push
