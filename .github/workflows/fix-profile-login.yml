name: Fix profile login
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-profile-login.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix profile access
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="document.getElementById('profileModal').classList.remove('show');go('players');alert('Acesso liberado ao perfil de '+selectedPlayer.name+'.')"
          new="document.getElementById('profileModal').classList.remove('show');go('players');document.getElementById('playersGrid').innerHTML='<div class=\"card\"><div class=\"big\">'+selectedPlayer.code+'</div><h2>'+selectedPlayer.name+'</h2><p class=\"muted\">🔓 Perfil desbloqueado</p><p>Senha confirmada com sucesso. Este é o perfil de <b>'+selectedPlayer.name+'</b>.</p><button class=\"btn primary\" onclick=\"playerCards()\">Voltar aos jogadores</button></div>';"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Open player profile after password' || exit 0
          git push
