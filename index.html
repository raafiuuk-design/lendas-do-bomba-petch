<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOMBA PETCH</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font-family:Arial,sans-serif}header{padding:18px;background:#12151c;position:sticky;top:0;z-index:5}.wrap{max-width:1000px;margin:auto;padding:0 18px}.logo{font-size:24px;font-weight:900}.logo b,.orange{color:#ff7300}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.nav button,button{cursor:pointer;border:1px solid #383e4b;background:#191e27;color:#fff;padding:11px 15px;border-radius:8px}.primary{background:#ff7300;border-color:#ff7300}.danger{background:#40171b}.page{display:none;padding:30px 0}.page.active{display:block}.card{background:#12161e;border:1px solid #2d333f;border-radius:12px;padding:20px;margin:15px 0}.form{display:grid;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field input,.field select{padding:12px;border-radius:7px;border:1px solid #3a414d;background:#07090d;color:#fff;font-size:16px;width:100%}.field input:focus,.field select:focus{outline:2px solid #ff7300}.actions,.row{display:flex;gap:8px;flex-wrap:wrap}.row{justify-content:space-between;align-items:center}.item{padding:14px;background:#0e1117;border:1px solid #292f39;border-radius:9px;margin:8px 0}.muted{color:#9da5b2}.status{padding:10px;border-radius:8px;background:#181c24;margin:15px 0}.error{color:#ff9090}.ok{color:#75e39a}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20;padding:20px}.modal.show{display:grid}.modal .card{width:min(420px,100%)}.user{font-size:13px;color:#75e39a}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><div class="logo">BOMBA <b>PETCH</b></div><div class="nav"><button onclick="page('home')">Início</button><button onclick="page('players')">Jogadores</button><button onclick="page('games')">Partidas</button><button onclick="page('seasons')">Temporadas</button><button onclick="page('trophies')">Troféus</button><button onclick="page('ranking')">Ranking</button><button id="loginBtn" class="primary" onclick="openLogin()">Entrar</button><button id="logoutBtn" style="display:none" onclick="logout()">Sair</button></div><div id="userInfo" class="user"></div></div></header><main class="wrap"><div id="status" class="status">Carregando...</div><section id="home" class="page active"><h1>BOMBA <span class="orange">PETCH</span></h1><p class="muted">Site colaborativo. Visitantes podem visualizar. Para editar e salvar, faça login.</p><div class="actions"><button class="primary" onclick="page('players')">Ver jogadores</button><button onclick="page('ranking')">Ver ranking</button></div></section><section id="players" class="page"><div class="row"><h2>Jogadores</h2><button class="primary editOnly" onclick="openPlayer()">+ Novo jogador</button></div><div id="playerForm"></div><div id="playersList"></div></section><section id="games" class="page"><div class="row"><h2>Partidas</h2><button class="primary editOnly" onclick="openGame()">+ Nova partida</button></div><div id="gameForm"></div><div id="gamesList"></div></section><section id="seasons" class="page"><div class="row"><h2>Temporadas</h2><button class="primary editOnly" onclick="openSeason()">+ Nova temporada</button></div><div id="seasonForm"></div><div id="seasonsList"></div></section><section id="trophies" class="page"><div class="row"><h2>Troféus</h2><button class="primary editOnly" onclick="openTrophy()">+ Novo troféu</button></div><div id="trophyForm"></div><div id="trophiesList"></div></section><section id="ranking" class="page"><h2>Ranking</h2><div id="rankingList"></div></section></main><div id="modal" class="modal"><div class="card form"><h2 id="authTitle">Entrar</h2><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div><div id="authError" class="error"></div><div class="actions"><button id="authAction" class="primary" onclick="login()">ENTRAR</button><button onclick="closeLogin()">Cancelar</button></div><button id="toggleAuth" onclick="toggleSignup()">Criar uma conta</button></div></div><script>
const SB='https://vgurvbdbpxcgkhmunlxr.supabase.co',KEY='sb_publishable_Dlgj0c5D_PVKP0h7x6GZ4w_BssxbIoj';let P=[],G=[],S=[],T=[],token=localStorage.getItem('bp_token'),user=JSON.parse(localStorage.getItem('bp_user')||'null'),signup=false;
const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function auth(path,body){let r=await fetch(SB+'/auth/v1/'+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'Falha na autenticação');return j}
async function api(table,method='GET',body=null,query=''){let headers={apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',Prefer:method==='POST'?'return=representation':'return=minimal'};let r=await fetch(SB+'/rest/v1/'+table+query,{method,headers,body:body?JSON.stringify(body):undefined});let text=await r.text();if(!r.ok)throw new Error(text||r.status);return text?JSON.parse(text):null}
function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));el(id).classList.add('active');window.scrollTo(0,0)}function status(t,bad=false){el('status').textContent=t;el('status').className='status '+(bad?'error':'ok')}
function openLogin(){el('modal').classList.add('show');el('authError').textContent='';el('email').focus()}function closeLogin(){el('modal').classList.remove('show')}function toggleSignup(){signup=!signup;el('authTitle').textContent=signup?'Criar conta':'Entrar';el('authAction').textContent=signup?'CRIAR CONTA':'ENTRAR';el('toggleAuth').textContent=signup?'Já tenho uma conta':'Criar uma conta';el('authAction').onclick=signup?signupUser:login}
async function login(){try{let j=await auth('token?grant_type=password',{email:el('email').value.trim(),password:el('password').value});setSession(j);closeLogin();status('Login realizado. Você pode editar o site.');await load()}catch(e){el('authError').textContent=e.message}}
async function signupUser(){try{let j=await auth('signup',{email:el('email').value.trim(),password:el('password').value});if(!j.access_token){el('authError').textContent='Conta criada. Confirme o e-mail e depois entre.';return}setSession(j);closeLogin();await ensureRole();status('Conta criada e login realizado.');await load()}catch(e){el('authError').textContent=e.message}}
function setSession(j){token=j.access_token;user=j.user;localStorage.setItem('bp_token',token);localStorage.setItem('bp_user',JSON.stringify(user));refreshAuthUI()}
async function ensureRole(){if(!token||!user)return;try{let r=await api('site_roles','GET',null,'?user_id=eq.'+encodeURIComponent(user.id)+'&select=user_id,role');if(!r.length)await api('site_roles','POST',{user_id:user.id,role:'owner'})}catch(e){console.log('role',e.message)}}
function logout(){token=null;user=null;localStorage.removeItem('bp_token');localStorage.removeItem('bp_user');refreshAuthUI();render();status('Você saiu. Visitantes só podem visualizar.')}
function refreshAuthUI(){let on=!!token;el('loginBtn').style.display=on?'none':'inline-block';el('logoutBtn').style.display=on?'inline-block':'none';el('userInfo').textContent=on?'Logado: '+(user?.email||'usuário'):'Visitante — somente leitura';document.querySelectorAll('.editOnly').forEach(b=>b.style.display=on?'inline-block':'none')}
function needLogin(){if(!token){openLogin();return false}return true}
async function load(){try{[P,G,S,T]=await Promise.all([api('players','GET',null,'?select=*&order=name'),api('games','GET',null,'?select=*&order=played_at.desc'),api('seasons','GET',null,'?select=*&order=created_at.desc'),api('trophies','GET',null,'?select=*&order=created_at.desc')]);render();status(token?'Banco conectado — modo edição ativo.':'Banco conectado — modo visitante.')}catch(e){status('Erro ao carregar banco: '+e.message,true);render()}refreshAuthUI()}
function render(){el('playersList').innerHTML=P.map(p=>`<div class="item"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.nickname||'')}</div></div>${token?`<div class="actions"><button onclick="openPlayer(${p.id})">Editar</button><button class="danger" onclick="del('players',${p.id})">Excluir</button></div>`:''}</div></div>`).join('')||'<div class="card">Nenhum jogador.</div>';el('gamesList').innerHTML=G.map(g=>`<div class="item"><div class="row"><span>${esc(n(g.player_a_id))} <b>${g.score_a} × ${g.score_b}</b> ${esc(n(g.player_b_id))}</span>${token?`<div><button onclick="openGame(${g.id})">Editar</button> <button class="danger" onclick="del('games',${g.id})">Excluir</button></div>`:''}</div></div>`).join('')||'<div class="card">Nenhuma partida.</div>';el('seasonsList').innerHTML=S.map(s=>`<div class="item"><div class="row"><b>${esc(s.name)}</b>${token?`<div><button onclick="openSeason(${s.id})">Editar</button> <button class="danger" onclick="del('seasons',${s.id})">Excluir</button></div>`:''}</div></div>`).join('')||'<div class="card">Nenhuma temporada.</div>';el('trophiesList').innerHTML=T.map(t=>`<div class="item"><div class="row"><div><b>${esc(t.name||t.title||'Troféu')}</b><div class="muted">${esc(t.description||'')}</div></div>${token?`<div><button onclick="openTrophy(${t.id})">Editar</button> <button class="danger" onclick="del('trophies',${t.id})">Excluir</button></div>`:''}</div></div>`).join('')||'<div class="card">Nenhum troféu.</div>';ranking()}
function n(id){let p=P.find(x=>String(x.id)===String(id));return p?p.name:'?'}
function openPlayer(id){if(!needLogin())return;let p=P.find(x=>x.id==id)||{};el('playerForm').innerHTML=`<div class="card form"><div class="grid"><div class="field"><label>Nome</label><input id="pn" placeholder="Escreva aqui" value="${esc(p.name||'')}"></div><div class="field"><label>Apelido</label><input id="pk" placeholder="Apelido" value="${esc(p.nickname||'')}"></div></div><div class="actions"><button class="primary" onclick="savePlayer(${id||0})">SALVAR</button><button onclick="el('playerForm').innerHTML=''">Cancelar</button></div></div>`;el('pn').focus()}
async function savePlayer(id){if(!needLogin())return;try{let d={name:el('pn').value.trim(),nickname:el('pk').value.trim()||null};if(!d.name)return status('Digite um nome.',true);if(id)await api('players','PATCH',d,'?id=eq.'+id);else await api('players','POST',d);el('playerForm').innerHTML='';await load()}catch(e){status('Erro ao salvar: '+e.message,true)}}
function opts(id){return P.map(p=>`<option value="${p.id}" ${p.id==id?'selected':''}>${esc(p.name)}</option>`).join('')}
function openGame(id){if(!needLogin())return;let g=G.find(x=>x.id==id)||{};el('gameForm').innerHTML=`<div class="card form"><div class="grid"><div class="field"><label>Jogador 1</label><select id="ga">${opts(g.player_a_id)}</select></div><div class="field"><label>Jogador 2</label><select id="gb">${opts(g.player_b_id)}</select></div><div class="field"><label>Placar 1</label><input id="sa" type="number" min="0" value="${g.score_a??0}"></div><div class="field"><label>Placar 2</label><input id="sb" type="number" min="0" value="${g.score_b??0}"></div></div><div class="actions"><button class="primary" onclick="saveGame(${id||0})">SALVAR PARTIDA</button><button onclick="el('gameForm').innerHTML=''">Cancelar</button></div></div>`}
async function saveGame(id){if(!needLogin())return;try{let d={player_a_id:+el('ga').value,player_b_id:+el('gb').value,score_a:+el('sa').value||0,score_b:+el('sb').value||0};if(d.player_a_id===d.player_b_id)return status('Escolha jogadores diferentes.',true);if(id)await api('games','PATCH',d,'?id=eq.'+id);else await api('games','POST',d);el('gameForm').innerHTML='';await load()}catch(e){status('Erro: '+e.message,true)}}
function openSeason(id){if(!needLogin())return;let s=S.find(x=>x.id==id)||{};el('seasonForm').innerHTML=`<div class="card form"><div class="field"><label>Nome da temporada</label><input id="sn" placeholder="Ex.: Temporada 2026" value="${esc(s.name||'')}"></div><div class="actions"><button class="primary" onclick="saveSeason(${id||0})">SALVAR</button><button onclick="el('seasonForm').innerHTML=''">Cancelar</button></div></div>`;el('sn').focus()}
async function saveSeason(id){if(!needLogin())return;try{let d={name:el('sn').value.trim()};if(!d.name)return status('Digite o nome.',true);if(id)await api('seasons','PATCH',d,'?id=eq.'+id);else await api('seasons','POST',d);el('seasonForm').innerHTML='';await load()}catch(e){status('Erro ao salvar: '+e.message,true)}}
function openTrophy(id){if(!needLogin())return;let t=T.find(x=>x.id==id)||{};el('trophyForm').innerHTML=`<div class="card form"><div class="grid"><div class="field"><label>Nome do troféu</label><input id="tn" placeholder="Nome" value="${esc(t.name||t.title||'')}"></div><div class="field"><label>Descrição</label><input id="td" placeholder="Descrição" value="${esc(t.description||'')}"></div></div><div class="actions"><button class="primary" onclick="saveTrophy(${id||0})">SALVAR</button><button onclick="el('trophyForm').innerHTML=''">Cancelar</button></div></div>`;el('tn').focus()}
async function saveTrophy(id){if(!needLogin())return;try{let d={name:el('tn').value.trim(),description:el('td').value.trim()||null};if(!d.name)return status('Digite o nome.',true);if(id)await api('trophies','PATCH',d,'?id=eq.'+id);else await api('trophies','POST',d);el('trophyForm').innerHTML='';await load()}catch(e){status('Erro ao salvar: '+e.message,true)}}
async function del(table,id){if(!needLogin()||!confirm('Excluir este registro?'))return;try{await api(table,'DELETE',null,'?id=eq.'+id);await load()}catch(e){status('Erro ao excluir: '+e.message,true)}}
function ranking(){let r={};P.forEach(p=>r[p.id]={p,j:0,w:0,e:0,d:0,pts:0});G.forEach(g=>{let a=r[g.player_a_id],b=r[g.player_b_id];if(!a||!b)return;a.j++;b.j++;if(g.score_a>g.score_b){a.w++;a.pts+=3;b.d++}else if(g.score_b>g.score_a){b.w++;b.pts+=3;a.d++}else{a.e++;b.e++;a.pts++;b.pts++}});el('rankingList').innerHTML=Object.values(r).sort((a,b)=>b.pts-a.pts||b.w-a.w).map((x,i)=>`<div class="item"><b>#${i+1} ${esc(x.p.name)}</b> — ${x.pts} pts | ${x.j} jogos | ${x.w}V ${x.e}E ${x.d}D</div>`).join('')||'<div class="card">Nenhum jogador.</div>'}
refreshAuthUI();load();
</script></body></html>
